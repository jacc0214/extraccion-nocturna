<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extracción Nocturna</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      overflow: hidden;
      background: #05070a;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e8eef5;
      user-select: none;
    }
    canvas { display: block; }

    #hud { position: fixed; inset: 0; pointer-events: none; }

    #mira {
      position: absolute; left: 50%; top: 50%;
      width: 18px; height: 18px;
      transform: translate(-50%, -50%);
    }
    #mira::before, #mira::after {
      content: ""; position: absolute; background: #d0e4ff;
      transition: background 0.08s;
    }
    #mira::before { left: 8px; top: 0; width: 2px; height: 18px; }
    #mira::after  { top: 8px; left: 0; height: 2px; width: 18px; }
    #mira.impacto::before, #mira.impacto::after { background: #ff4d4d; }

    #panel-izq {
      position: absolute; left: 20px; top: 18px;
      background: rgba(8,12,18,0.7);
      padding: 12px 16px; border-radius: 8px;
      font-size: 15px; line-height: 1.55;
      border: 1px solid rgba(100,140,200,0.25);
    }
    #panel-izq b { color: #7ec8ff; }

    #aviso {
      position: absolute; left: 50%; top: 20%;
      transform: translateX(-50%);
      font-size: 24px; font-weight: 700;
      text-shadow: 0 2px 12px #000;
      opacity: 0; transition: opacity 0.25s;
      text-align: center; max-width: 80%;
    }
    #aviso.visible { opacity: 1; }

    #velocidad {
      position: absolute; left: 20px; bottom: 22px;
      font-size: 16px; color: #5eead4;
      display: none; letter-spacing: 1px;
    }

    #arsenal {
      position: absolute; right: 20px; bottom: 20px;
      text-align: right;
    }
    .slot {
      margin-top: 6px;
      padding: 9px 14px;
      background: rgba(8,12,18,0.7);
      border: 2px solid transparent;
      border-radius: 7px;
      font-size: 16px;
    }
    .slot.activo { border-color: #fbbf24; color: #fbbf24; }
    .slot.vacio .cargador { color: #ff6b6b; }

    #pantalla {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(4,6,10,0.88);
      text-align: center; padding: 24px;
    }
    #pantalla.oculta { display: none; }
    #pantalla h1 {
      font-size: 48px; margin-bottom: 12px;
      letter-spacing: 2px;
    }
    #pantalla h1.derrota { color: #ff5252; }
    #pantalla h1.victoria { color: #34d399; }
    #pantalla p {
      max-width: 580px; font-size: 17px;
      line-height: 1.55; color: #b8c4d4;
    }
    #pantalla button {
      margin-top: 22px;
      padding: 13px 34px;
      font-size: 18px; font-weight: 700;
      background: #fbbf24; color: #111;
      border: none; border-radius: 7px;
      cursor: pointer;
    }
    #pantalla button:disabled {
      background: #444; color: #999; cursor: wait;
    }
    kbd {
      background: #1e2530;
      border: 1px solid #4a5568;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.9em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div id="mira"></div>
    <div id="panel-izq">
      Enemigos restantes: <b id="restantes">0</b><br>
      Distancia a extracción: <b id="metros">0</b> m
    </div>
    <div id="aviso"></div>
    <div id="velocidad">⚡ VELOCIDAD AUMENTADA</div>
    <div id="arsenal">
      <div class="slot activo" id="slot1">
        [1] <span class="nombre">Revólver</span> — <span class="cargador">0</span>
      </div>
      <div class="slot" id="slot2">
        [2] <span class="nombre">Escopeta</span> — <span class="cargador">0</span>
      </div>
    </div>
  </div>

  <div id="pantalla">
    <h1 id="titulo-pantalla">EXTRACCIÓN NOCTURNA</h1>
    <p id="texto-pantalla"></p>
    <button id="boton-pantalla" disabled>Cargando recursos...</button>
  </div>

  <script type="module" src="./juego.js"></script>
</body>
</html>
